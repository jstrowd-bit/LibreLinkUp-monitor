<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#ffd700"/>
    </linearGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#00f0ff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#04050a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="100" fill="#04050a"/>
  
  <!-- Subtle Background Grid -->
  <path d="M 128 0 V 512 M 256 0 V 512 M 384 0 V 512 M 0 128 H 512 M 0 256 H 512 M 0 384 H 512" stroke="rgba(255,255,255,0.03)" stroke-width="2"/>

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#sensorGlow)"/>

  <!-- Circular CGM Sensor Housing (Outer Ring) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#cyanGold)" stroke-width="5" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="rgba(0, 240, 255, 0.2)" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Sensor Inset Aperture -->
  <circle cx="256" cy="256" r="115" fill="#090d16" stroke="rgba(255, 215, 0, 0.45)" stroke-width="3"/>
  <circle cx="256" cy="256" r="45" fill="none" stroke="#00f0ff" stroke-width="2.5" stroke-dasharray="4 4"/>

  <!-- Continuous Glucose Telemetry Pulse Waveform -->
  <path d="M 64 256 H 180 L 205 210 L 235 315 L 265 170 L 295 285 L 315 256 H 448" 
        fill="none" 
        stroke="url(#cyanGold)" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        filter="url(#glow)"/>

  <!-- Central Real-time Telemetry Node -->
  <circle cx="256" cy="256" r="12" fill="#ffd700" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="5" fill="#ffffff"/>
  
  <!-- Upper & Lower Biological Threshold Markers -->
  <line x1="160" y1="180" x2="352" y2="180" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="160" y1="332" x2="352" y2="332" stroke="rgba(255, 75, 75, 0.4)" stroke-width="2" stroke-dasharray="6 6"/>
</svg>
